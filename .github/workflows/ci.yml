name: CI

on:
  push:
  pull_request:

jobs:
  detforge:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install (exact versions from uv.lock)
        run: uv sync --locked --extra dev

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest -q

      - name: Lint rules
        run: uv run detforge lint

      - name: Test rules
        run: uv run detforge test

      - name: Convert rules
        run: uv run detforge convert --target all

      - name: Coverage
        run: uv run detforge coverage

      - name: Report
        if: always()
        run: uv run detforge report

      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detforge-dist
          path: dist/
