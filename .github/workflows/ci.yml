name: CI

on:
  push:
  pull_request:

jobs:
  detforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest -q

      - name: Lint rules
        run: detforge lint

      - name: Test rules
        run: detforge test

      - name: Convert rules
        run: detforge convert --target all

      - name: Coverage
        run: detforge coverage

      - name: Report
        if: always()
        run: detforge report

      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detforge-dist
          path: dist/
